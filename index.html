<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>従業員ポータル</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", sans-serif;
    text-align: center;
    padding: 48px 20px;
    color: #333;
  }
  .msg { font-size: 16px; line-height: 1.7; }
  .btn {
    display: inline-block;
    margin-top: 24px;
    padding: 12px 28px;
    background: #06C755;
    color: #fff;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
  }
  input, select {
    width: 85%;
    max-width: 320px;
    padding: 12px;
    margin: 8px 0;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fff;
  }
  .loading { color: #999; }

  .shift-wrap { text-align: left; max-width: 520px; margin: 0 auto; }
  .shift-title { font-size: 18px; font-weight: bold; margin-bottom: 4px; }
  .shift-sub { color: #666; font-size: 14px; margin-bottom: 16px; }
  .shift-day { border-bottom: 1px solid #eee; padding: 12px 0; }
  .shift-day:first-of-type { padding-top: 0; }
  .shift-day-label { font-size: 14px; font-weight: bold; margin-bottom: 8px; }
  .avail-toggle { display: flex; gap: 6px; margin-bottom: 8px; }
  .avail-btn {
    flex: 1;
    padding: 9px 0;
    font-size: 13px;
    font-weight: bold;
    font-family: inherit;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: #fff;
    color: #777;
    cursor: pointer;
  }
  .avail-btn.active { background: #06C755; color: #fff; border-color: #06C755; }
  .avail-btn.active[data-value="不可"] { background: #d94f4f; border-color: #d94f4f; }
  .shift-day input.time-input {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 10px;
    margin: 0;
    font-size: 13px;
  }
  .sat { color: #2a6fdb; }
  .sun { color: #d94f4f; }
  .submit-row { text-align: center; margin-top: 20px; }

  .post-wrap { text-align: left; max-width: 520px; margin: 0 auto; }
  .post-form textarea {
    width: 100%;
    box-sizing: border-box;
    min-height: 90px;
    padding: 10px;
    font-size: 15px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-family: inherit;
  }
  .post-form input.store-input {
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 8px;
  }
  .post-list { margin-top: 24px; }
  .post-item {
    border-bottom: 1px solid #eee;
    padding: 12px 0;
  }
  .post-meta { font-size: 12px; color: #888; margin-bottom: 4px; }
  .store-chip {
    display: inline-block;
    font-size: 11px;
    font-weight: bold;
    padding: 1px 8px;
    border-radius: 999px;
    background: #eef1ef;
    color: #555;
    margin-right: 6px;
  }
  .store-chip.store-shimotakaido { background: #e5f0fb; color: #1b5fb0; }
  .store-chip.store-chitosekarasuyama { background: #fdefe0; color: #b0611b; }
  .store-chip.store-sengawa { background: #f2e8fb; color: #7231b0; }
  .store-chip.store-all { background: #06C755; color: #fff; }
  .post-body { font-size: 15px; white-space: pre-wrap; word-break: break-word; }
  .status-badge {
    display: inline-block;
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 6px;
  }
  .status-未対応 { background: #fdecea; color: #c0392b; }
  .status-対応中 { background: #fff6da; color: #a67c00; }
  .status-対応済み { background: #e6f6ea; color: #1e7e34; }
  .category-badge {
    display: inline-block;
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 10px;
    margin-right: 4px;
  }
  .category-general { background: #eef1ef; color: #555; }
  .category-bug { background: #fde7e0; color: #b0401b; }
  .answer-box {
    margin-top: 8px;
    padding: 8px 10px;
    background: #f5f7fa;
    border-radius: 6px;
    font-size: 14px;
    white-space: pre-wrap;
  }
  .empty-note { color: #999; font-size: 14px; margin-top: 16px; }

  .request-box {
    background: #f5f7fa;
    border: 1px dashed #ccc;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 18px;
  }
  .request-label { font-size: 13px; font-weight: bold; }
  .request-sub { font-size: 12px; color: #888; margin-bottom: 6px; }
  .btn-outline {
    background: #fff;
    color: #06C755;
    border: 1px solid #06C755;
  }

  .filter-label {
    font-size: 12px;
    font-weight: bold;
    color: #666;
    margin-bottom: 4px;
  }
  .filter-select { display: block; margin-bottom: 16px; }
  .comment-list { margin-top: 8px; }
  .comment-item {
    margin-top: 6px;
    padding: 6px 10px;
    background: #f5f7fa;
    border-radius: 6px;
  }
  .comment-meta { font-size: 11px; color: #999; }
  .comment-body { font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .comment-form {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    align-items: center;
  }
  .comment-form .comment-input {
    flex: 1;
    width: auto;
    max-width: none;
    margin: 0;
    padding: 8px;
    font-size: 14px;
  }
  .comment-form .comment-btn {
    display: inline-block;
    padding: 8px 14px;
    background: #06C755;
    color: #fff;
    border-radius: 6px;
    text-decoration: none;
    font-size: 14px;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div id="app"><p class="loading">読み込み中...</p></div>

<script>
// ============================================================
// この2つは環境に合わせて書き換えてください。
//   LIFF_ID  … LINE DevelopersのLIFFアプリID
//   GAS_URL  … GASウェブアプリの /exec URL（末尾に /exec まで含める）
// ============================================================
const LIFF_ID = '2010703154-HggFrqTC';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxB_bpQacFg30sr6NUtFgUkHjuzKApsFjL1HbyBSXsrVUU4P6p-d2qlN0gK0kQasdng/exec';

const PAGE = new URLSearchParams(location.search).get('page') || '';

// GAS側のJSON APIを呼び出すためのヘルパー（google.script.run の代わり）
function callGet(action, params) {
  const qs = new URLSearchParams(Object.assign({ action: action }, params || {})).toString();
  return fetch(GAS_URL + '?' + qs).then((r) => r.json());
}
function callPost(action, params) {
  return fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // プリフライトを避けるため text/plain で送る
    body: JSON.stringify(Object.assign({ action: action }, params || {})),
  }).then((r) => r.json());
}

async function main() {
  const app = document.getElementById('app');

  if (!LIFF_ID) {
    app.innerHTML = '<p class="msg">LIFF_IDが未設定です。管理部にご連絡ください。</p>';
    return;
  }

  await liff.init({ liffId: LIFF_ID });
  if (!liff.isLoggedIn()) {
    // redirectUriを指定しないと、ログイン後に ?page=xxx が消えたURLへ戻ってしまうため、
    // 現在のURL（クエリ文字列込み）を明示的に指定する。
    liff.login({ redirectUri: location.href });
    return;
  }

  const idToken = liff.getIDToken();
  if (!idToken) {
    app.innerHTML = '<p class="msg">LINEログイン情報を取得できませんでした。LIFFアプリのスコープ設定（openid）をご確認ください。</p>';
    return;
  }

  if (PAGE === 'register') {
    return renderRegister(idToken, app);
  }

  if (PAGE === 'shift') {
    return renderShiftForm(idToken, app);
  }

  if (PAGE === 'board') {
    return renderBoard(idToken, app);
  }

  if (PAGE === 'suggest') {
    return renderSuggest(idToken, app);
  }

  // freee / manual / coupon などのゲート付きページ
  let res;
  try {
    res = await callGet('resolveDestination', { idToken: idToken, page: PAGE });
  } catch (err) {
    app.innerHTML = '<p class="msg">通信エラーが発生しました。時間をおいて再度お試しください。</p>';
    return;
  }

  if (res.allowed) {
    location.href = res.url;
    return;
  }

  switch (res.reason) {
    case 'not_registered':
      return renderRegister(idToken, app);
    case 'not_approved':
      app.innerHTML = '<p class="msg">現在、管理部の承認待ちです。<br>承認までしばらくお待ちください。</p>';
      break;
    case 'inactive':
      app.innerHTML = '<p class="msg">このアカウントはご利用いただけません。<br>心当たりがない場合は管理部までご連絡ください。</p>';
      break;
    default:
      app.innerHTML = '<p class="msg">現在この機能はご利用いただけません。管理部までご連絡ください。</p>'
        + '<p style="font-size:11px;color:#bbb;margin-top:20px;">(debug reason: ' + escapeHtml_(JSON.stringify(res)) + ')</p>';
  }
}

const STORE_OPTIONS = ['下高井戸店', '千歳烏山店', '仙川店', '本部'];

function renderRegister(idToken, app) {
  const storeOptionsHtml = ['<option value="" disabled selected>選択してください</option>']
    .concat(STORE_OPTIONS.map((s) => `<option value="${s}">${s}</option>`))
    .join('');
  app.innerHTML = `
    <p class="msg">初めてのご利用ですね。<br>お名前と所属店舗を入力してください。</p>
    <input id="name" placeholder="氏名（例：山田太郎／スペースなしで入力）"><br>
    <select id="store">${storeOptionsHtml}</select><br>
    <a href="#" class="btn" id="submitBtn">登録する</a>
  `;
  document.getElementById('submitBtn').addEventListener('click', async (ev) => {
    ev.preventDefault();
    // 全角・半角スペースを除去して表記を統一する
    const name = document.getElementById('name').value.trim().replace(/[\s　]+/g, '');
    const store = document.getElementById('store').value;
    if (!name || !store) {
      alert('氏名と所属店舗を入力してください');
      return;
    }
    app.innerHTML = '<p class="loading">登録中...</p>';
    try {
      const res = await callPost('registerUser', { idToken: idToken, name: name, store: store });
      if (res.ok) {
        app.innerHTML = '<p class="msg">登録を受け付けました。<br>管理部の承認後にご利用いただけます。</p>';
      } else if (res.error === 'already_registered') {
        app.innerHTML = '<p class="msg">登録済みです。管理部の承認をお待ちください。</p>';
      } else {
        app.innerHTML = '<p class="msg">登録に失敗しました。管理部までご連絡ください。</p>';
      }
    } catch (err) {
      app.innerHTML = '<p class="msg">通信エラーが発生しました。時間をおいて再度お試しください。</p>';
    }
  });
}

async function renderShiftForm(idToken, app) {
  app.innerHTML = '<p class="loading">読み込み中...</p>';

  let res;
  try {
    res = await callGet('getShiftForm', { idToken: idToken });
  } catch (err) {
    app.innerHTML = '<p class="msg">通信エラーが発生しました。時間をおいて再度お試しください。</p>';
    return;
  }

  if (!res.allowed) {
    switch (res.reason) {
      case 'not_registered':
        return renderRegister(idToken, app);
      case 'not_approved':
        app.innerHTML = '<p class="msg">現在、管理部の承認待ちです。<br>承認までしばらくお待ちください。</p>';
        break;
      case 'inactive':
        app.innerHTML = '<p class="msg">このアカウントはご利用いただけません。<br>心当たりがない場合は管理部までご連絡ください。</p>';
        break;
      case 'window_closed':
        app.innerHTML = '<p class="msg">現在、シフト希望の受付期間ではありません。<br>次回の受付は' + escapeHtml_(res.nextWindowLabel || '') + 'です。</p>';
        break;
      default:
        app.innerHTML = '<p class="msg">現在この機能はご利用いただけません。管理部までご連絡ください。</p>';
    }
    return;
  }

  const availabilityOptions = res.availabilityOptions || ['昼', '夜', '終日', '不可'];
  const days = res.dates.map((d) => {
    const existing = res.existing[d.date] || {};
    const wdClass = d.weekday === '土' ? 'sat' : (d.weekday === '日' ? 'sun' : '');
    const timeVal = existing.timePref ? existing.timePref.replace(/"/g, '&quot;') : '';
    const btnsHtml = availabilityOptions.map((v) =>
      `<button type="button" class="avail-btn${existing.availability === v ? ' active' : ''}" data-value="${v}">${v}</button>`
    ).join('');
    return `
      <div class="shift-day" data-date="${d.date}">
        <div class="shift-day-label">${d.date.slice(5)}（<span class="${wdClass}">${d.weekday}</span>）</div>
        <div class="avail-toggle">${btnsHtml}</div>
        <input class="time-input" type="text" placeholder="希望時間・備考（任意）" value="${timeVal}">
      </div>`;
  }).join('');

  app.innerHTML = `
    <div class="shift-wrap">
      <div class="shift-title">シフト希望提出（${res.period.label}）</div>
      <div class="shift-sub">${res.name}さん（${res.store}）<br>日ごとに「昼」「夜」「終日」「不可」から選んでください。締切は${res.period.deadline || ''}です。</div>
      <div id="shiftDays">${days}</div>
      <div class="submit-row">
        <a href="#" class="btn" id="shiftSubmitBtn">この内容で提出する</a>
      </div>
    </div>
  `;

  document.querySelectorAll('.avail-toggle').forEach((group) => {
    group.querySelectorAll('.avail-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        group.querySelectorAll('.avail-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });
  });

  document.getElementById('shiftSubmitBtn').addEventListener('click', async (ev) => {
    ev.preventDefault();
    const dayEls = document.querySelectorAll('#shiftDays .shift-day');
    const entries = Array.from(dayEls).map((el) => {
      const activeBtn = el.querySelector('.avail-btn.active');
      return {
        date: el.getAttribute('data-date'),
        availability: activeBtn ? activeBtn.getAttribute('data-value') : '',
        timePref: el.querySelector('.time-input').value.trim(),
      };
    });

    document.getElementById('shiftSubmitBtn').textContent = '送信中...';
    try {
      const submitRes = await callPost('submitShift', { idToken: idToken, periodLabel: res.period.label, entries: entries });
      if (submitRes.ok) {
        app.innerHTML = '<p class="msg">シフト希望を提出しました。<br>締切前であれば、もう一度開いて修正・再提出できます。</p>';
      } else {
        app.innerHTML = '<p class="msg">提出に失敗しました。時間をおいて再度お試しください。</p>';
      }
    } catch (err) {
      app.innerHTML = '<p class="msg">通信エラーが発生しました。時間をおいて再度お試しください。</p>';
    }
  });
}

/** 未登録・未承認・在籍なし等の共通メッセージ表示。renderRegisterへの分岐が必要な場合はtrueを返す。
 *  res … サーバーからの応答オブジェクト全体（デバッグ表示のため）。 */
function renderDenied(res, idToken, app) {
  const reason = res && res.reason;
  switch (reason) {
    case 'not_registered':
      renderRegister(idToken, app);
      return;
    case 'not_approved':
      app.innerHTML = '<p class="msg">現在、管理部の承認待ちです。<br>承認までしばらくお待ちください。</p>';
      return;
    case 'inactive':
      app.innerHTML = '<p class="msg">このアカウントはご利用いただけません。<br>心当たりがない場合は管理部までご連絡ください。</p>';
      return;
    default:
      app.innerHTML = '<p class="msg">現在この機能はご利用いただけません。管理部までご連絡ください。</p>'
        + '<p style="font-size:11px;color:#bbb;margin-top:20px;">(debug res: ' + escapeHtml_(JSON.stringify(res)) + ')</p>';
  }
}

async function renderBoard(idToken, app, storeFilter) {
  app.innerHTML = '<p class="loading">読み込み中...</p>';

  let res;
  try {
    res = await callGet('getBoardPosts', { idToken: idToken, store: storeFilter || '全体' });
  } catch (err) {
    app.innerHTML = '<p class="msg">通信エラーが発生しました。時間をおいて再度お試しください。</p>';
    return;
  }
  if (!res.allowed) {
    return renderDenied(res, idToken, app);
  }

  const filterOptionsHtml = ['全体', '全店舗対象'].concat(res.stores).map((s) => {
    const sel = s === res.filter ? 'selected' : '';
    return `<option value="${s}" ${sel}>${s}</option>`;
  }).join('');
  const postStoreOptionsHtml = ['<option value="" disabled selected>選択してください</option>']
    .concat(res.postTargets.map((s) => `<option value="${s}">${s}</option>`))
    .join('');

  const listHtml = res.posts.length
    ? res.posts.map((p) => {
        const commentsHtml = p.comments.length
          ? p.comments.map((c) => `
              <div class="comment-item">
                <div class="comment-meta">${c.commentedAt}　${escapeHtml_(c.name)}</div>
                <div class="comment-body">${escapeHtml_(c.body)}</div>
              </div>`).join('')
          : '';
        const storeLabel = `<span class="store-chip ${storeChipClass_(p.store)}">${p.store}</span>`;
        return `
        <div class="post-item" data-post-id="${p.postId}">
          <div class="post-meta">${storeLabel}${p.postedAt}　${p.name}</div>
          <div class="post-body">${escapeHtml_(p.body)}</div>
          <div class="comment-list">${commentsHtml}</div>
          <div class="comment-form">
            <input class="comment-input" placeholder="コメントする">
            <a href="#" class="comment-btn">送信</a>
          </div>
        </div>`;
      }).join('')
    : '<p class="empty-note">まだ投稿はありません。</p>';

  const missingStores = res.allStores.filter((s) => res.stores.indexOf(s) === -1);
  const requestHtml = (res.restricted && missingStores.length)
    ? `
      <div class="request-box">
        <div class="request-label">担当店舗が増えましたか？</div>
        <div class="request-sub">追加してほしい店舗を選ぶと、本部に申請できます。</div>
        <select id="requestStore">
          <option value="" disabled selected>選択してください</option>
          ${missingStores.map((s) => `<option value="${s}">${s}</option>`).join('')}
        </select>
        <a href="#" class="btn btn-outline" id="requestStoreBtn">この店舗を追加申請する</a>
      </div>`
    : '';

  app.innerHTML = `
    <div class="post-wrap">
      <div class="shift-title">引き継ぎ掲示板</div>
      <div class="shift-sub">閲覧したい店舗の投稿が見られない場合は、下記から申請してください。</div>
      <div class="filter-label">表示する店舗を絞り込む</div>
      <select id="boardFilter" class="filter-select">${filterOptionsHtml}</select>
      <div class="post-form">
        <select id="boardStore">${postStoreOptionsHtml}</select>
        <textarea id="boardBody" placeholder="引き継ぎ内容を入力してください"></textarea>
        <div class="submit-row"><a href="#" class="btn" id="boardSubmitBtn">投稿する</a></div>
      </div>
      ${requestHtml}
      <div class="post-list">${listHtml}</div>
    </div>
  `;

  document.getElementById('boardFilter').addEventListener('change', (ev) => {
    renderBoard(idToken, app, ev.target.value);
  });

  document.getElementById('boardSubmitBtn').addEventListener('click', async (ev) => {
    ev.preventDefault();
    const body = document.getElementById('boardBody').value;
    const store = document.getElementById('boardStore').value;
    if (!store) {
      alert('投稿先の店舗を選択してください');
      return;
    }
    if (!body.trim()) {
      alert('内容を入力してください');
      return;
    }
    try {
      const submitRes = await callPost('postBoard', { idToken: idToken, store: store, body: body });
      if (submitRes.ok) {
        renderBoard(idToken, app, document.getElementById('boardFilter').value);
      } else {
        alert('投稿に失敗しました。時間をおいて再度お試しください。');
      }
    } catch (err) {
      alert('通信エラーが発生しました。時間をおいて再度お試しください。');
    }
  });

  const requestStoreBtn = document.getElementById('requestStoreBtn');
  if (requestStoreBtn) {
    requestStoreBtn.addEventListener('click', async (ev) => {
      ev.preventDefault();
      const store = document.getElementById('requestStore').value;
      if (!store) {
        alert('追加してほしい店舗を選択してください');
        return;
      }
      requestStoreBtn.textContent = '送信中...';
      try {
        const reqRes = await callPost('requestStoreAccess', { idToken: idToken, store: store });
        if (reqRes.ok) {
          alert('本部に申請しました。承認され次第、閲覧・投稿できるようになります。');
          renderBoard(idToken, app, document.getElementById('boardFilter').value);
        } else {
          alert('申請に失敗しました。時間をおいて再度お試しください。');
          requestStoreBtn.textContent = 'この店舗を追加申請する';
        }
      } catch (err) {
        alert('通信エラーが発生しました。時間をおいて再度お試しください。');
        requestStoreBtn.textContent = 'この店舗を追加申請する';
      }
    });
  }

  document.querySelectorAll('.comment-btn').forEach((btn) => {
    btn.addEventListener('click', async (ev) => {
      ev.preventDefault();
      const postItem = btn.closest('.post-item');
      const postId = postItem.getAttribute('data-post-id');
      const input = postItem.querySelector('.comment-input');
      const body = input.value;
      if (!body.trim()) {
        alert('コメント内容を入力してください');
        return;
      }
      btn.textContent = '送信中...';
      try {
        const submitRes = await callPost('postBoardComment', { idToken: idToken, postId: postId, body: body });
        if (submitRes.ok) {
          renderBoard(idToken, app, document.getElementById('boardFilter').value);
        } else {
          alert('コメントの送信に失敗しました。時間をおいて再度お試しください。');
          btn.textContent = '送信';
        }
      } catch (err) {
        alert('通信エラーが発生しました。時間をおいて再度お試しください。');
        btn.textContent = '送信';
      }
    });
  });
}

async function renderSuggest(idToken, app) {
  app.innerHTML = '<p class="loading">読み込み中...</p>';

  let res;
  try {
    res = await callGet('getSuggestions', { idToken: idToken });
  } catch (err) {
    app.innerHTML = '<p class="msg">通信エラーが発生しました。時間をおいて再度お試しください。</p>';
    return;
  }
  if (!res.allowed) {
    return renderDenied(res, idToken, app);
  }

  const listHtml = res.items.length
    ? res.items.map((it) => `
        <div class="post-item">
          <div class="post-meta">${it.postedAt}${res.isHq ? '　' + it.name + '（' + it.store + '）' : ''}
            <span class="category-badge category-${it.category === '不具合報告' ? 'bug' : 'general'}">${it.category}</span>
            <span class="status-badge status-${it.status}">${it.status}</span>
          </div>
          <div class="post-body">${escapeHtml_(it.body)}</div>
          ${it.answer ? `<div class="answer-box">本部より：${escapeHtml_(it.answer)}</div>` : ''}
        </div>`).join('')
    : '<p class="empty-note">まだ投稿はありません。</p>';

  app.innerHTML = `
    <div class="post-wrap">
      <div class="shift-title">本部への要望・質問${res.isHq ? '（全員分）' : ''}</div>
      <div class="shift-sub">${res.isHq ? '全スタッフからの投稿を確認できます。' : '内容は投稿者本人と本部のみが閲覧できます。システムの不具合報告もこちらから送れます。'}</div>
      <div class="post-form">
        <select id="suggestCategory">
          <option value="一般要望">一般要望・質問</option>
          <option value="不具合報告">不具合報告（システムの不具合）</option>
        </select>
        <textarea id="suggestBody" placeholder="要望・改善案・質問や、不具合の内容（発生した画面・操作内容など）を入力してください"></textarea>
        <div class="submit-row"><a href="#" class="btn" id="suggestSubmitBtn">送信する</a></div>
      </div>
      <div class="post-list">${listHtml}</div>
    </div>
  `;

  document.getElementById('suggestSubmitBtn').addEventListener('click', async (ev) => {
    ev.preventDefault();
    const body = document.getElementById('suggestBody').value;
    const category = document.getElementById('suggestCategory').value;
    if (!body.trim()) {
      alert('内容を入力してください');
      return;
    }
    try {
      const submitRes = await callPost('postSuggestion', { idToken: idToken, body: body, category: category });
      if (submitRes.ok) {
        renderSuggest(idToken, app);
      } else {
        alert('送信に失敗しました。時間をおいて再度お試しください。');
      }
    } catch (err) {
      alert('通信エラーが発生しました。時間をおいて再度お試しください。');
    }
  });
}

/** 掲示板の店舗タグを店舗ごとに色分けするためのクラス名を返す */
function storeChipClass_(store) {
  const map = {
    '下高井戸店': 'store-shimotakaido',
    '千歳烏山店': 'store-chitosekarasuyama',
    '仙川店': 'store-sengawa',
    '全店舗対象': 'store-all',
  };
  return map[store] || '';
}

function escapeHtml_(s) {
  return String(s || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

main().catch((err) => {
  document.getElementById('app').innerHTML =
    '<p class="msg">エラーが発生しました。管理部までご連絡ください。</p>' +
    '<a class="btn" href="?page=suggest">要望・質問フォームを開く</a>';
  console.error(err);
});
</script>
