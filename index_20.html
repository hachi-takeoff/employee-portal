<body>
  <div id="app"><p class="loading">読み込み中...</p></div>

<script>
// ============================================================
// この2つは環境に合わせて書き換えてください。
//   LIFF_ID  … LINE DevelopersのLIFFアプリID
//   GAS_URL  … GASウェブアプリの /exec URL（末尾に /exec まで含める）
// ============================================================
const LIFF_ID = '2010703154-HggFrqTC';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwdDN-Q4kPR1etX1scvXFctsrnCOATv86Lye7Gy2JYiaOBvtm7uTiyp3oTFgS_GbIRN/exec';

const PAGE = new URLSearchParams(location.search).get('page') || '';

// URLの末尾に &debug=1 を付けたときだけ、エラーの詳細を画面に表示する（原因調査用）
if (new URLSearchParams(location.search).get('debug') === '1') {
  document.documentElement.classList.add('debug-on');
}

// LINEのログイン情報が古くなっていた場合に、一度だけ自動で再ログインするための仕組み。
// （無限ループを避けるため、1回試したらsessionStorageに印を付ける）
function isTokenError_(res) {
  if (!res || res.ok !== false) return false;
  const msg = String(res.message || '');
  return res.error === 'server_error'
    && (msg.indexOf('トークン') >= 0 || msg.indexOf('ログイン情報') >= 0);
}
function recoverLogin_(res) {
  if (!isTokenError_(res)) return false;
  let tried = false;
  try { tried = sessionStorage.getItem('portalRelogin') === '1'; } catch (e) {}
  if (tried) return false;
  try { sessionStorage.setItem('portalRelogin', '1'); } catch (e) {}
  try { liff.logout(); } catch (e) {}
  liff.login({ redirectUri: location.href });
  return true;
}
function clearReloginFlag_() {
  try { sessionStorage.removeItem('portalRelogin'); } catch (e) {}
}

// GAS側のJSON APIを呼び出すためのヘルパー（google.script.run の代わり）
async function callGet(action, params) {
  const qs = new URLSearchParams(Object.assign({ action: action }, params || {})).toString();
  const r = await fetch(GAS_URL + '?' + qs);
  const res = await r.json();
  // トークン切れなら再ログインへ飛ばす（このPromiseは解決させない）
  if (recoverLogin_(res)) return new Promise(function () {});
  if (res && res.ok !== false) clearReloginFlag_();
  return res;
}
async function callPost(action, params) {
  const r = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // プリフライトを避けるため text/plain で送る
    body: JSON.stringify(Object.assign({ action: action }, params || {})),
  });
  const res = await r.json();
  if (recoverLogin_(res)) return new Promise(function () {});
  if (res && res.ok !== false) clearReloginFlag_();
  return res;
}

async function main() {
  const app = document.getElementById('app');

  if (!LIFF_ID) {
    app.innerHTML = '<p class="msg">LIFF_IDが未設定です。管理部にご連絡ください。</p>';
    return;
  }

  await liff.init({ liffId: LIFF_ID });
  if (!liff.isLoggedIn()) {
    // redirectUriを指定しないと、ログイン後に ?page=xxx が消えたURLへ戻ってしまうため、
    // 現在のURL（クエリ文字列込み）を明示的に指定する。
    liff.login({ redirectUri: location.href });
    return;
  }

  // IDトークンは発行時刻から短時間で期限切れになり、LIFFが自動更新しないため使わない。
  // アクセストークンはliff.init()時に更新されるので、こちらをサーバー側の本人確認に使う。
  const idToken = liff.getAccessToken();
  if (!idToken) {
    app.innerHTML = '<p class="msg">LINEログイン情報を取得できませんでした。一度LINEアプリからメニューを開き直してください。</p>';
    return;
  }

  // ?page= を付けずに開いたとき（URLを直接開いた場合など）は、入口メニューを表示する
  if (!PAGE) {
    return renderHome(idToken, app);
  }

  if (PAGE === 'register') {
    return renderRegister(idToken, app);
  }

  if (PAGE === 'shift') {
    return renderShiftForm(idToken, app);
  }

  if (PAGE === 'coupon') {
    return renderCoupon(idToken, app);
  }

  if (PAGE === 'board') {
    return renderBoard(idToken, app);
  }

  if (PAGE === 'suggest') {
    return renderSuggest(idToken, app);
  }

  // freee / manual / coupon などのゲート付きページ
  let res;
  try {
    res = await callGet('resolveDestination', { idToken: idToken, page: PAGE });
  } catch (err) {
    app.innerHTML = '<p class="msg">通信エラーが発生しました。時間をおいて再度お試しください。</p>';
    return;
  }

  if (res.allowed) {
    location.href = res.url;
    return;
  }

  switch (res.reason) {
    case 'not_registered':
      return renderRegister(idToken, app);
    case 'not_approved':
      app.innerHTML = '<p class="msg">現在、管理部の承認待ちです。<br>承認までしばらくお待ちください。</p>';
      break;
    case 'inactive':
      app.innerHTML = '<p class="msg">このアカウントはご利用いただけません。<br>心当たりがない場合は管理部までご連絡ください。</p>';
      break;
    default:
      app.innerHTML = '<p class="msg">現在この機能はご利用いただけません。管理部までご連絡ください。</p>'
        + '<p class="debug-detail">' + escapeHtml_(JSON.stringify(res)) + '</p>';
  }
}

const STORE_OPTIONS = ['下高井戸店', '千歳烏山店', '仙川店', '本部'];

function renderRegister(idToken, app) {
  const storeOptionsHtml = ['<option value="" disabled selected>選択してください</option>']
    .concat(STORE_OPTIONS.map((s) => `<option value="${s}">${s}</option>`))
    .join('');
  app.innerHTML = `
    <p class="msg">初めてのご利用ですね。<br>お名前と所属店舗を入力してください。</p>
    <input id="name" placeholder="氏名（例：山田太郎／スペースなしで入力）"><br>
    <select id="store">${storeOptionsHtml}</select><br>
    <a href="#" class="btn" id="submitBtn">登録する</a>
  `;
  document.getElementById('submitBtn').addEventListener('click', async (ev) => {
    ev.preventDefault();
    // 全角・半角スペースを除去して表記を統一する
    const name = document.getElementById('name').value.trim().replace(/[\s　]+/g, '');
    const store = document.getElementById('store').value;
    if (!name || !store) {
      alert('氏名と所属店舗を入力してください');
      return;
    }
    app.innerHTML = '<p class="loading">登録中...</p>';
    try {
      const res = await callPost('registerUser', { idToken: idToken, name: name, store: store });
      if (res.ok) {
        app.innerHTML = '<p class="msg">登録を受け付けました。<br>管理部の承認後にご利用いただけます。</p>';
      } else if (res.error === 'already_registered') {
        app.innerHTML = '<p class="msg">登録済みです。管理部の承認をお待ちください。</p>';

}

async function renderShiftForm(idToken, app) {
  app.innerHTML = '<p class="loading">読み込み中...</p>';

  let res;
  try {
    res = await callGet('getShiftForm', { idToken: idToken });
  } catch (err) {
    app.innerHTML = '<p class="msg">通信エラーが発生しました。時間をおいて再度お試しください。</p>';
    return;
  }

  if (!res.allowed) {
    switch (res.reason) {
      case 'not_registered':
        return renderRegister(idToken, app);
      case 'not_approved':
        app.innerHTML = '<p class="msg">現在、管理部の承認待ちです。<br>承認までしばらくお待ちください。</p>';
        break;
      case 'inactive':
        app.innerHTML = '<p class="msg">このアカウントはご利用いただけません。<br>心当たりがない場合は管理部までご連絡ください。</p>';
        break;
      default:
        app.innerHTML = '<p class="msg">現在この機能はご利用いただけません。管理部までご連絡ください。</p>';
    }
    return;
  }

  const availabilityOptions = res.availabilityOptions || ['昼', '夜', '不可'];
  const days = res.dates.map((d) => {
    const existing = res.existing[d.date] || {};
    // 保存済みの値は「昼・夜」のように「・」区切りで入っているので、配列に戻す
    const selected = String(existing.availability || '').split('・').filter(Boolean);
    const wdClass = d.weekday === '土' ? 'sat' : (d.weekday === '日' ? 'sun' : '');
    const timeVal = existing.timePref ? existing.timePref.replace(/"/g, '&quot;') : '';
    // 定休日は入力させない（グレー表示にして、選択肢も入力欄も出さない）
    if (d.closed) {
      return `
        <div class="shift-day shift-day-closed" data-date="${d.date}" data-closed="1">
          <div class="shift-day-label">${d.date.slice(5)}（<span class="${wdClass}">${d.weekday}</span>）</div>
          <div class="closed-label">定休日</div>
        </div>`;
    }
    const btnsHtml = availabilityOptions.map((v) =>
      `<button type="button" class="avail-btn${selected.indexOf(v) >= 0 ? ' active' : ''}" data-value="${v}">${v}</button>`
    ).join('');
    return `
      <div class="shift-day" data-date="${d.date}">
        <div class="shift-day-label">${d.date.slice(5)}（<span class="${wdClass}">${d.weekday}</span>）</div>
        <div class="avail-toggle">${btnsHtml}</div>
        <input class="time-input" type="text" placeholder="希望時間・備考（任意）" value="${timeVal}">
      </div>`;
  }).join('');

  // 締切を過ぎていても提出はできる。その場合だけ注意書きを出す。
  const overdueHtml = res.period.overdue
    ? `<div class="overdue-note">締切（${res.period.deadline || ''}）を過ぎています。提出は可能ですが、シフトが確定済みの場合は希望に沿えないことがあります。至急提出してください。</div>`
    : '';

  // 提出済みの場合は、最終提出日時を控えとして画面上部に出す
  const submittedHtml = res.submittedAt
    ? `<div class="submitted-note">提出済みです（最終提出：${escapeHtml_(res.submittedAt)}）。<br>下の内容が現在の提出内容です。修正して再提出できます。</div>`
    : '';

  app.innerHTML = `
    <div class="shift-wrap">
      <div class="shift-title">シフト希望提出（${res.period.label}）</div>
      <div class="shift-sub">${res.name}さん（${res.store}）<br>日ごとに「昼」「夜」「不可」から選んでください（昼と夜の両方を選べます）。<br>定休日を除く全ての日付の入力が必要です。締切は${res.period.deadline || ''}です。</div>
      ${submittedHtml}
      ${overdueHtml}
      <div id="shiftDays">${days}</div>
      <div id="shiftNotice" class="shift-notice"></div>
      <div class="submit-row">
        <a href="#" class="btn" id="shiftSubmitBtn">この内容で提出する</a>
      </div>
    </div>
  `;

  // 「昼」「夜」は複数選択できる。「不可」は他と同時に選べない（排他）。
  document.querySelectorAll('.avail-toggle').forEach((group) => {
    group.querySelectorAll('.avail-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const value = btn.getAttribute('data-value');
        const wasActive = btn.classList.contains('active');
        if (value === '不可') {
          group.querySelectorAll('.avail-btn').forEach((b) => b.classList.remove('active'));
          if (!wasActive) btn.classList.add('active');
        } else {
          const naBtn = group.querySelector('.avail-btn[data-value="不可"]');
          if (naBtn) naBtn.classList.remove('active');
          btn.classList.toggle('active');
        }
        group.parentElement.classList.remove('shift-day-error');
      });
    });
  });

  document.getElementById('shiftSubmitBtn').addEventListener('click', async (ev) => {
    ev.preventDefault();
    // 定休日は入力対象外なので除外する
    const dayEls = document.querySelectorAll('#shiftDays .shift-day:not(.shift-day-closed)');
    const entries = Array.from(dayEls).map((el) => {
      const values = Array.from(el.querySelectorAll('.avail-btn.active'))
        .map((b) => b.getAttribute('data-value'));
      return {
        date: el.getAttribute('data-date'),
        availability: values.join('・'),
        timePref: el.querySelector('.time-input').value.trim(),
      };
    });

    // 未入力の日付があれば提出させない
    const missing = [];
    entries.forEach((entry, i) => {
      const el = dayEls[i];
      if (entry.availability) {
        el.classList.remove('shift-day-error');
      } else {
        el.classList.add('shift-day-error');
        missing.push(entry.date.slice(5));
      }
    });
    if (missing.length > 0) {
      const notice = document.getElementById('shiftNotice');
      notice.textContent = '未入力の日付があります（' + missing.join('、') + '）。全ての日付を選択してください。';
      notice.style.display = 'block';
      const firstError = document.querySelector('.shift-day-error');
      if (firstError) firstError.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    document.getElementById('shiftNotice').style.display = 'none';

    document.getElementById('shiftSubmitBtn').textContent = '送信中...';
    try {
      const submitRes = await callPost('submitShift', { idToken: idToken, periodLabel: res.period.label, entries: entries });
      if (submitRes.ok) {
        renderShiftReceipt(submitRes, res, idToken, app);
      } else {
        app.innerHTML = '<p class="msg">提出に失敗しました。時間をおいて再度お試しください。</p>';
      }
    } catch (err) {
      app.innerHTML = '<p class="msg">通信エラーが発生しました。時間をおいて再度お試しください。</p>';
    }
  });
}

/** サーバーが発行した時刻を起点に、画面の時計を1秒ごとに進める */
function startCouponClock_(issuedEpoch) {
  const el = document.getElementById('couponClock');
  if (!el || !issuedEpoch) return;
  const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
  // 端末の時計がずれていても、サーバー発行時刻を基準にするための差分
  const offset = issuedEpoch - Date.now();
  const tick = () => {
    if (!document.getElementById('couponClock')) return; // 画面が切り替わったら停止
    const d = new Date(Date.now() + offset);
    const p2 = (n) => (n < 10 ? '0' : '') + n;
    el.textContent = d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日('
      + weekdays[d.getDay()] + ') '
      + p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds());
    setTimeout(tick, 1000);
  };
  tick();
}

/**
 * 写真を投稿できるサイズまで縮小し、data URL（JPEG）にして返す。
 * スマホの写真はそのままだと数MBあり、送信に失敗するため必ず縮小する。
 */
function shrinkImage_(file, maxSize) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('画像を読み込めませんでした'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('画像を読み込めませんでした'));
      img.onload = () => {
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.8));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

          <label class="photo-btn" for="boardPhoto">写真を選ぶ</label>
          <input type="file" id="boardPhoto" accept="image/*" hidden>
          <span class="photo-name" id="boardPhotoName">選択されていません</span>
          <a href="#" class="photo-clear" id="boardPhotoClear" hidden>取り消す</a>
        </div>
        <img id="boardPhotoPreview" class="photo-preview" hidden alt="選択した写真">
        <label class="notify-toggle">
          <input type="checkbox" id="boardNotify">
          対象店舗のスタッフにLINEで通知する
        </label>
        <div class="notify-note">通知には配信通数を消費します。急ぎの連絡のときだけお使いください。</div>
        <label class="notify-toggle manual-toggle">
          <input type="checkbox" id="boardToManual">
          マニュアルに追加する
        </label>
        <div class="notify-note">今後もルールとして残したい内容のときに選んでください。管理部がマニュアルに反映します。</div>
        <div class="submit-row"><a href="#" class="btn" id="boardSubmitBtn">投稿する</a></div>
      </div>
      ${requestHtml}
      <div class="post-list">${listHtml}</div>
    </div>
  `;

  // 現在の表示条件を保ったまま一覧を読み直すための共通処理
  const reload = () => renderBoard(
    idToken, app,
    document.getElementById('boardFilter').value,
    document.getElementById('showResolved').checked
  );

  document.getElementById('boardFilter').addEventListener('change', reload);
  document.getElementById('showResolved').addEventListener('change', reload);

  // 写真の選択（選んだ時点で縮小し、プレビューを表示する）
  let selectedPhoto = null;
  const photoInput = document.getElementById('boardPhoto');
  const photoName = document.getElementById('boardPhotoName');
  const photoPreview = document.getElementById('boardPhotoPreview');
  const photoClear = document.getElementById('boardPhotoClear');

  const clearPhoto = () => {
    selectedPhoto = null;
    photoInput.value = '';
    photoName.textContent = '選択されていません';
    photoPreview.hidden = true;
    photoClear.hidden = true;
  };

  photoInput.addEventListener('change', async () => {
    const file = photoInput.files && photoInput.files[0];
    if (!file) return clearPhoto();
    photoName.textContent = '読み込み中...';
    try {
      selectedPhoto = await shrinkImage_(file, 1200);
      photoPreview.src = selectedPhoto;
      photoPreview.hidden = false;
      photoClear.hidden = false;
      photoName.textContent = file.name;
    } catch (err) {
      clearPhoto();
      alert('この写真は読み込めませんでした。別の写真をお試しください。');
    }
  });

  photoClear.addEventListener('click', (ev) => { ev.preventDefault(); clearPhoto(); });

  const boardSubmitBtn = document.getElementById('boardSubmitBtn');
  boardSubmitBtn.addEventListener('click', async (ev) => {
    ev.preventDefault();
    const body = document.getElementById('boardBody').value;
    const store = document.getElementById('boardStore').value;
    if (!store) {
      alert('投稿先の店舗を選択してください');
      return;
    }
    if (!body.trim()) {
      alert('内容を入力してください');
      return;
    }
    boardSubmitBtn.textContent = selectedPhoto ? '写真を送信中...' : '送信中...';
    try {
      const params = { idToken: idToken, store: store, body: body };
      if (selectedPhoto) {
        params.image = { data: selectedPhoto, mimeType: 'image/jpeg' };
      }
      if (document.getElementById('boardNotify').checked) {
        params.notify = true;
      }
      if (document.getElementById('boardToManual').checked) {
        params.toManual = true;
      }
      const submitRes = await callPost('postBoard', params);
      if (submitRes.ok) {
        const notes = [];
        const n = submitRes.notified;
        if (n && n.error) {
          notes.push('通知の送信に失敗しました。');
        } else if (n) {
          notes.push(n.sent + '人に通知しました。');
        }
        const m = submitRes.manual;
        if (m && !m.ok) {
          notes.push('マニュアルへの追加に失敗しました。');
        } else if (m) {
          notes.push('マニュアルに追加しました。');
        }
        if (notes.length) alert(notes.join('\n'));
        reload();
      } else {
        alert('投稿に失敗しました。時間をおいて再度お試しください。');
        boardSubmitBtn.textContent = '投稿する';
      }
    } catch (err) {
      alert('通信エラーが発生しました。時間をおいて再度お試しください。');
      boardSubmitBtn.textContent = '投稿する';
    }
  });

  // 解決済み／未解決の切り替え
  document.querySelectorAll('.status-btn').forEach((btn) => {
    btn.addEventListener('click', async (ev) => {
      ev.preventDefault();
      const postId = btn.closest('.post-item').getAttribute('data-post-id');
      const next = btn.getAttribute('data-next');
      btn.textContent = '変更中...';
      try {
        const r = await callPost('setBoardPostStatus', { idToken: idToken, postId: postId, status: next });
        if (r.ok) { reload(); } else { alert('変更に失敗しました。'); }
      } catch (err) {
        alert('通信エラーが発生しました。時間をおいて再度お試しください。');
      }
    });
  });

  // 削除（いきなり消さず、確認の1ステップを挟む）
  document.querySelectorAll('.delete-btn').forEach((btn) => {
    btn.addEventListener('click', (ev) => {
      ev.preventDefault();
      const item = btn.closest('.post-item');
      item.querySelector('.post-actions').style.display = 'none';
      item.querySelector('.delete-confirm').style.display = 'block';
    });
  });
  document.querySelectorAll('.delete-no').forEach((btn) => {
    btn.addEventListener('click', (ev) => {
      ev.preventDefault();
      const item = btn.closest('.post-item');
      item.querySelector('.delete-confirm').style.display = 'none';
      item.querySelector('.post-actions').style.display = 'flex';
    });
  });
  document.querySelectorAll('.delete-yes').forEach((btn) => {
    btn.addEventListener('click', async (ev) => {
      ev.preventDefault();
      const postId = btn.closest('.post-item').getAttribute('data-post-id');
      btn.textContent = '削除中...';
      try {
        const r = await callPost('deleteBoardPost', { idToken: idToken, postId: postId });
        if (r.ok) { reload(); } else { alert('削除に失敗しました。'); }
      } catch (err) {
        alert('通信エラーが発生しました。時間をおいて再度お試しください。');
      }
    });
  });

  const requestStoreBtn = document.getElementById('requestStoreBtn');
  if (requestStoreBtn) {
    requestStoreBtn.addEventListener('click', async (ev) => {
      ev.preventDefault();
      const store = document.getElementById('requestStore').value;
      if (!store) {
        alert('追加してほしい店舗を選択してください');
        return;
      }
      requestStoreBtn.textContent = '送信中...';
      try {
        const reqRes = await callPost('requestStoreAccess', { idToken: idToken, store: store });
        if (reqRes.ok) {
          alert('本部に申請しました。承認され次第、閲覧・投稿できるようになります。');
          reload();
        } else {
          alert('申請に失敗しました。時間をおいて再度お試しください。');
          requestStoreBtn.textContent = 'この店舗を追加申請する';
        }
      } catch (err) {
        alert('通信エラーが発生しました。時間をおいて再度お試しください。');
        requestStoreBtn.textContent = 'この店舗を追加申請する';
      }
    });
  }

  document.querySelectorAll('.comment-btn').forEach((btn) => {
    btn.addEventListener('click', async (ev) => {
      ev.preventDefault();
      const postItem = btn.closest('.post-item');
      const postId = postItem.getAttribute('data-post-id');
      const input = postItem.querySelector('.comment-input');
      const body = input.value;
      if (!body.trim()) {
        alert('コメント内容を入力してください');
        return;
      }
      btn.textContent = '送信中...';
      try {
        const submitRes = await callPost('postBoardComment', { idToken: idToken, postId: postId, body: body });
        if (submitRes.ok) {
          reload();
        } else {
          alert('コメントの送信に失敗しました。時間をおいて再度お試しください。');
          btn.textContent = '送信';
        }
      } catch (err) {
        alert('通信エラーが発生しました。時間をおいて再度お試しください。');
        btn.textContent = '送信';
      }
    });
  });
}

async function renderSuggest(idToken, app) {
  app.innerHTML = '<p class="loading">読み込み中...</p>';

  let res;
  try {
    res = await callGet('getSuggestions', { idToken: idToken });
  } catch (err) {
    app.innerHTML = '<p class="msg">通信エラーが発生しました。時間をおいて再度お試しください。</p>';
    return;
  }
  if (!res.allowed) {
    return renderDenied(res, idToken, app);
  }

  const listHtml = res.items.length
    ? res.items.map((it) => `
        <div class="post-item">
          <div class="post-meta">${it.postedAt}${res.isHq ? '　' + it.name + '（' + it.store + '）' : ''}
            <span class="category-badge category-${it.category === '不具合報告' ? 'bug' : 'general'}">${it.category}</span>
            <span class="status-badge status-${it.status}">${it.status}</span>
          </div>
          <div class="post-body">${escapeHtml_(it.body)}</div>
          ${it.answer ? `<div class="answer-box">本部より：${escapeHtml_(it.answer)}</div>` : ''}
        </div>`).join('')
    : '<p class="empty-note">まだ投稿はありません。</p>';

  app.innerHTML = `
    <div class="post-wrap">
      <div class="shift-title">本部への要望・質問${res.isHq ? '（全員分）' : ''}</div>
      <div class="shift-sub">${res.isHq ? '全スタッフからの投稿を確認できます。' : '内容は投稿者本人と本部のみが閲覧できます。システムの不具合報告もこちらから送れます。'}</div>
      <div class="post-form">
        <select id="suggestCategory">
          <option value="一般要望">一般要望・質問</option>
          <option value="不具合報告">不具合報告（システムの不具合）</option>
        </select>
        <textarea id="suggestBody" placeholder="要望・改善案・質問や、不具合の内容（発生した画面・操作内容など）を入力してください"></textarea>
        <div class="submit-row"><a href="#" class="btn" id="suggestSubmitBtn">送信する</a></div>
      </div>
      <div class="post-list">${listHtml}</div>
    </div>
  `;

  document.getElementById('suggestSubmitBtn').addEventListener('click', async (ev) => {
    ev.preventDefault();
    const body = document.getElementById('suggestBody').value;
    const category = document.getElementById('suggestCategory').value;
    if (!body.trim()) {
      alert('内容を入力してください');
      return;
    }
    try {
      const submitRes = await callPost('postSuggestion', { idToken: idToken, body: body, category: category });
      if (submitRes.ok) {
        renderSuggest(idToken, app);
      } else {
        alert('送信に失敗しました。時間をおいて再度お試しください。');
      }
    } catch (err) {
      alert('通信エラーが発生しました。時間をおいて再度お試しください。');
    }
  });
}

/** 掲示板の店舗タグを店舗ごとに色分けするためのクラス名を返す */
function storeChipClass_(store) {
  const map = {
    '下高井戸店': 'store-shimotakaido',
    '千歳烏山店': 'store-chitosekarasuyama',
    '仙川店': 'store-sengawa',
    '全店舗対象': 'store-all',
  };
  return map[store] || '';
}

function escapeHtml_(s) {
  return String(s || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

main().catch((err) => {
  // 想定外のエラー。URLに &debug=1 を付けると、下に原因が表示される。
  document.getElementById('app').innerHTML =
    '<p class="msg">エラーが発生しました。管理部までご連絡ください。</p>' +
    '<a class="btn" href="?page=board">引き継ぎ掲示板を開く</a>' +
    '<p class="debug-detail">' + escapeHtml_(String(err && err.stack ? err.stack : err)) + '</p>';
  console.error(err);
});
</script>
